#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"
service_tier = "fast"
model_verbosity = "low"

# Runtime selections made by the user still take precedence.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
hooks = true
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 2
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "ultra"
interrupt_message = true

# Override every general-purpose spawn role as read-only. The root session is
# the only writer; subagents inspect, challenge, and report.
[agents.default]
description = "Read-only general checker; never writes or publishes."
config_file = "agents/default.toml"

[agents.worker]
description = "Read-only worker override; implementation delegation is disabled for Cogito++."
config_file = "agents/worker.toml"

[agents.explorer]
description = "Read-only codebase explorer for bounded evidence gathering."
config_file = "agents/explorer.toml"

# Explicit declarations keep the roles available on Codex 0.146.x while the
# standalone .codex/agents discovery format rolls out across clients.
[agents.contract_auditor]
description = "Read-only preflight auditor for Cogito++ contract consistency, prerequisites, ownership, and traceability."
config_file = "agents/contract-auditor.toml"

[agents.exit_gate_verifier]
description = "Independent read-only verifier for one ticket's acceptance and any separately applicable Cogito++ stage Exit Gate."
config_file = "agents/exit-gate-verifier.toml"

# Documentation-only MCP. Product/runtime MCP work remains out of scope until
# G0-15 and its ADR are approved. GitHub metadata keeps using the connected app.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
default_tools_approval_mode = "auto"
startup_timeout_sec = 15
tool_timeout_sec = 60
